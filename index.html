<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#E9EBE4" />
    <meta name="apple-mobile-web-app-title" content="Foldwing" />
    <title>Foldwing — one line, mirrored</title>
    <meta
      name="description"
      content="Draw one line to the goal. Its mirror has to survive too, and half the walls are only on the other side."
    />
    <!--
      The web build is the Daily Fold, and the way people meet it is a link
      pasted into a group chat. Without these the unfurl is a bare URL, which is
      the difference between a card someone taps and a string of text nobody
      does.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Foldwing — one line, mirrored" />
    <meta
      property="og:description"
      content="One maze a day, the same for everyone. Half of it is only visible in the mirror."
    />
    <meta property="og:url" content="https://www.noqyris.com/foldwing/" />
    <meta name="twitter:card" content="summary" />
    <!--
      The mechanic as a 32px mark: the fold axis, a stroke, and its reflection.
      It replaces the stock heart the scaffold shipped with, which said nothing
      about the game and looked like somebody else's app in a tab strip.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E9EBE4'/%3E%3Cpath d='M16 3v26' stroke='%239A9C90' stroke-width='1' stroke-dasharray='2 2'/%3E%3Cpath d='M6 26c0-6 8-5 8-10S6 12 6 6' fill='none' stroke='%2316323C' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M26 26c0-6-8-5-8-10s8-4 8-10' fill='none' stroke='%238E3B62' stroke-width='3' stroke-linecap='round' opacity='0.55'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* Paper bleeds to the screen edge so FIT letterboxing is invisible. */
        background: #e9ebe4;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }
      /*
       * Lock the whole surface to the visual viewport. On a real iOS device a
       * scrollable / rubber-banding webview shifts the canvas bounding rect that
       * Phaser caches for input, so touches land offset from the visuals. This
       * game is nothing but pointer accuracy, so that offset would be fatal:
       * position:fixed + inset:0 removes every axis of scroll and keeps the
       * canvas rect and the pointer transform in permanent agreement.
       */
      html,
      body,
      #app {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
